role: orchestrator
kind: primary
description: Treibt den Workflow: stellt die Lage fest, waehlt den Modus, ruft Bausteine einzeln auf, wertet deren Verdict aus und pflegt Task-Status und PROGRESS.md. Schreibt selbst keinen Code.
# Welcher Harness fuehrt diese Rolle aus (subagent = eigener Harness des
# Orchestrators, opencode = fremder Harness als Unterprozess).
# Die Task-Datei kann das fuer Sonderfaelle ueberschreiben.
runtime: subagent
model_tier: standard
write_access: full
path_denies: []
max_steps: 200

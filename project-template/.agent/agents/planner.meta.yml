role: planner
kind: subagent
description: Schaerft eine unklare Anforderung und zerlegt eine Initiative in kleine, in sich geschlossene Task-Dateien unter .agent/tasks/. Implementiert selbst nichts.
# Welcher Harness fuehrt diese Rolle aus (subagent = eigener Harness des
# Orchestrators, opencode = fremder Harness als Unterprozess).
# Die Task-Datei kann das fuer Sonderfaelle ueberschreiben.
runtime: subagent
model_tier: strong
write_access: limited
path_allows: [".agent/**"]
max_steps: 60
